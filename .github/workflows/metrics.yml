name: Generate profile metrics

on:
  schedule:
    - cron: "0 */6 * * *" 
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isometric calendar
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Skyline
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/skyline.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 0
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.5
          plugin_skyline_compatibility: yes 

      - name: Achievements
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes

      - name: Languages (in-depth)
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      - name: Stargazers
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/stargazers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph

      - name: Contribution snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: nulswa
          outputs: |
            metrics/snake.svg
            metrics/snake-dark.svg?palette=github-dark

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update generated metrics"
          git push
