name: Generate profile metrics

on:
  schedule:
    - cron: "0 */6 * * *" # runs every 6 hours
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Isometric commit calendar :/
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3D commit skyline ._.
      - name: Skyline
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/skyline.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 0 # 0 = current year :v
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.5

      # Achievements :b
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes

      # Languages, in-depth analysis (clones your repos to analyze real usage) :v
      - name: Languages (in-depth)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # Stargazers :3
      # Default: line/graph chart, no extra setup needed.
      # Want the worldmap instead? Add plugin_stargazers_worldmap: yes and a
      # Google Geocoding API token as plugin_stargazers_worldmap_token (see README notes) xd :/
      - name: Stargazers
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/stargazers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph

      # Contribution snake (separate small action, not part of metrics) jjj
      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: nulswa
          outputs: |
            metrics/snake.svg
            metrics/snake-dark.svg?palette=github-dark

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update generated metrics"
          git push
